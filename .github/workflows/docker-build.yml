name: Build and Push PHP Images

on:
  push:
    branches: [main]
    paths:
      - '8.4-fpm/Dockerfile'
      - '8.5-fpm/Dockerfile'
      - '8.4-fpm-alpine/Dockerfile'
      - '8.5-fpm-alpine/Dockerfile'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: 8.4-fpm/Dockerfile
            image: dommin/php-8.4-fpm
            platforms: linux/amd64,linux/arm64   # dev: macOS + Linux

          - dockerfile: 8.5-fpm/Dockerfile
            image: dommin/php-8.5-fpm
            platforms: linux/amd64,linux/arm64   # dev: macOS + Linux

          - dockerfile: 8.4-fpm-alpine/Dockerfile
            image: dommin/php-8.4-fpm-alpine
            platforms: linux/amd64               # prod: Linux only

          - dockerfile: 8.5-fpm-alpine/Dockerfile
            image: dommin/php-8.5-fpm-alpine
            platforms: linux/amd64               # prod: Linux only

    steps:
      - uses: actions/checkout@v6

      - name: Check if this Dockerfile changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
               | grep -qE "^(${{ matrix.dockerfile }}|\.github/workflows/docker-build\.yml)$"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate version tag
        if: steps.changed.outputs.build == 'true'
        id: version
        run: |
          DATE=$(date +'%Y.%m.%d')
          SHORT=$(git rev-parse --short HEAD)
          echo "tag=${DATE}-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        if: steps.changed.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        if: steps.changed.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: steps.changed.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        if: steps.changed.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ steps.version.outputs.date }}
            ${{ matrix.image }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
